name: Auto Sync & Publish

on:
  schedule:
    # 每3天 UTC 02:00 = 北京时间 10:00 检查上游更新
    - cron: '0 2 */3 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-sync-publish
  cancel-in-progress: false

jobs:
  sync-and-publish:
    name: Sync upstream and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 使用 SYNC_PAT 才能推送含 .github/workflows 的上游提交（GITHUB_TOKEN 无 workflows 权限）
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure merge strategy
        run: |
          # .gitattributes 中标记为 merge=ours 的文件（Github.java、CNB 占位文件）
          # 合并上游时保留 fork 版本，避免冲突
          git config merge.ours.driver true

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/fish2018/webhtv.git 2>/dev/null || git remote set-url upstream https://github.com/fish2018/webhtv.git
          git fetch upstream main

      - name: Check for upstream updates
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$BEHIND" -gt 0 ]; then
            echo "has_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream changes
        if: steps.check.outputs.has_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge upstream/main --no-edit; then
            git merge --abort
            echo "::error title=Merge conflict::上游改动与 fork 本地修改冲突，请人工处理后再同步"
            exit 1
          fi

      - name: Strip CNB residue
        if: success() && steps.check.outputs.has_update == 'true'
        run: python3 .github/scripts/strip_cnb.py

      - name: Push synced main
        if: success() && steps.check.outputs.has_update == 'true'
        run: git push origin main

      - name: Trigger Android Release build
        if: success() && steps.check.outputs.has_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run android-release.yml --repo syzsky/webhtv --ref main
          echo "Android Release workflow triggered"

      - name: No upstream update
        if: steps.check.outputs.has_update == 'false'
        run: echo "Upstream has no new commits, skip publish."
